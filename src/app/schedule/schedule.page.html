<ion-content [fullscreen]="true">
  <main class="schedule-page">
    <section class="intro">
      <p class="eyebrow">TEAM · {{ teamId }}</p>
      <div class="intro-heading">
        <h1>Semana de entrenamiento</h1>
        @if (isCoach) {
          <ion-button (click)="openCreate()">
            <ion-icon slot="start" name="add-outline"></ion-icon>
            Agregar evento
          </ion-button>
        }
      </div>
      <p>Administra clases, scrims y partidas de Premier. El horario se comparte con los miembros de este equipo.</p>
    </section>

    <app-schedule-table
      [events]="(events$ | async) ?? []"
      [isCoach]="isCoach"
      (addEvent)="openCreate($event)"
      (eventSelected)="openEdit($event)"
    ></app-schedule-table>
  </main>
</ion-content>

<app-event-modal
  [isOpen]="modalOpen"
  [event]="selectedEvent"
  [defaultDay]="defaultDay"
  [teamId]="teamId"
  (saved)="saveEvent($event)"
  (deleted)="deleteEvent($event)"
  (dismissed)="closeModal()"
></app-event-modal>
